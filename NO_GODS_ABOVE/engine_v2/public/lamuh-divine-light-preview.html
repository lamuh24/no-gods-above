<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lamuh · Light Divine Vanish preview</title>
<style>body{margin:0;background:#091017;color:#e8e6ef;font:16px system-ui}main{max-width:1100px;margin:auto;padding:20px}h1{font-size:24px}canvas{width:100%;background:#101c28;border:1px solid #384854}button,select{font:inherit;padding:9px;margin:5px;background:#263448;color:white;border:1px solid #768099;border-radius:5px}p{color:#b5c2d1}#status{font-family:monospace}</style>
<main><h1>Light · Divine Vanish</h1><p>Current animation candidate · visible backward aura dash · Medium and Heavy are not included.</p><canvas id="view" width="1100" height="520"></canvas><div><button id="play">Pause</button><button id="step">+1 tick</button><button id="reset">Restart</button><select id="speed"><option value="1">1× speed</option><option value="0.5">0.5× speed</option></select><button id="face">Reverse facing</button></div><p id="status">Loading source frames…</p><p>20 simulation ticks · zero hits · 60-unit retreat. Isolated motion preview, not a production approval.</p></main>
<script>
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');const holds=[1,2,2,4,3,3,3,2];let tick=0,playing=true,facing=1,last=0,acc=0;const paths=['/lamuh-legacy-v2/movement-v2/idle-00.png',...Array.from({length:6},(_,i)=>`/lamuh-legacy-v2/divine-vanish-v1/pose-${String(i).padStart(2,'0')}.png`),'/lamuh-legacy-v2/movement-v2/idle-00.png'];
const images=paths.map(p=>{let i=new Image();i.src=p;return i});
function draw(){ctx.clearRect(0,0,1100,520);ctx.strokeStyle='#4a5b6d';ctx.beginPath();ctx.moveTo(40,445);ctx.lineTo(1060,445);ctx.stroke();let t=Math.min(tick,19),index=0,n=t;while(index<7&&n>=holds[index])n-=holds[index++];let retreat=0;for(let k=0;k<=t;k++)retreat+=k>=3&&k<=4?6:k>=5&&k<=6?18:k>=7&&k<=8?6:0;let x=550-facing*retreat*1.3;ctx.save();ctx.translate(x,445);ctx.scale(facing*.4,.4);ctx.drawImage(images[tick>=20?7:index],-768,-1360,2048,1536);ctx.restore();document.querySelector('#status').textContent=`${tick>=20?'Neutral pause':`Tick ${t+1}/20 · Pose ${index}/7`} · retreat ${retreat}/60 · ${playing?'Playing':'Paused'}`;}
Promise.all(images.map(i=>i.decode())).then(()=>{function loop(now){if(last&&playing){acc+=Math.min(now-last,100)*Number(document.querySelector('#speed').value);while(acc>=1000/60){tick=(tick+1)%65;acc-=1000/60;}}last=now;draw();requestAnimationFrame(loop)}requestAnimationFrame(loop)}).catch(e=>document.querySelector('#status').textContent='Frame loading failed: '+e.message);
document.querySelector('#play').onclick=()=>{playing=!playing;document.querySelector('#play').textContent=playing?'Pause':'Play'};document.querySelector('#step').onclick=()=>{playing=false;tick=(tick+1)%20;document.querySelector('#play').textContent='Play';draw()};document.querySelector('#reset').onclick=()=>{tick=0;acc=0;draw()};document.querySelector('#face').onclick=()=>{facing*=-1;draw()};
</script></html>
